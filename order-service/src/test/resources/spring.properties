# Интеграционные тесты order-service делят экземпляры PostgreSQL и Kafka.
# Контекст в кеше Spring продолжает выполнять публикацию outbox, задачи Saga и
# обработчики Kafka. Такой контекст может выбрать или заблокировать те же строки,
# которые OutboxRelayFailureTest проверяет вручную в своём контексте.
#
# Кеш на один контекст закрывает предыдущий до запуска тестов с новой конфигурацией.
# При чередовании классов с разными настройками Spring пересобирает их контексты.
spring.test.context.cache.maxSize=1
