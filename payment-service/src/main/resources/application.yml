server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USER:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_local_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:payment-service}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: false
      # EventEnvelopeReader читает строку и определяет тип по eventType. Некорректное
      # сообщение классифицируется обработчиком.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

# ---------------------------------------------------------------- надёжность (service-support)
# Таблицы создаёт миграция V2__create_payments.sql.
outbox:
  enabled: true
  aggregate-type: Payment
  poll-interval-ms: ${OUTBOX_POLL_MS:500}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  send-timeout: ${OUTBOX_SEND_TIMEOUT:PT15S}
  retention: ${OUTBOX_RETENTION:P7D}
  cleanup-interval-ms: ${OUTBOX_CLEANUP_MS:3600000}
  scheduler-enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
  producer:
    max-block-ms: ${OUTBOX_PRODUCER_MAX_BLOCK_MS:5000}
    request-timeout-ms: ${OUTBOX_PRODUCER_REQUEST_TIMEOUT_MS:5000}
    delivery-timeout-ms: ${OUTBOX_PRODUCER_DELIVERY_TIMEOUT_MS:10000}

idempotency:
  enabled: true
  retention: ${PROCESSED_EVENTS_RETENTION:P7D}
  cleanup-interval-ms: ${PROCESSED_EVENTS_CLEANUP_MS:3600000}

messaging:
  consumer:
    enabled: true
    concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
    retries: ${KAFKA_CONSUMER_RETRIES:3}
    initial-backoff-ms: ${KAFKA_CONSUMER_BACKOFF_MS:500}
    backoff-multiplier: ${KAFKA_CONSUMER_BACKOFF_MULTIPLIER:2.0}
    max-backoff-ms: ${KAFKA_CONSUMER_MAX_BACKOFF_MS:4000}

payments:
  # Число попыток команды при конфликте оптимистической блокировки.
  max-attempts: ${PAYMENT_MAX_ATTEMPTS:3}

# Имитатор принимает одно и то же решение для каждого заказа.
# PAYMENT_DECLINE_ABOVE задаёт максимальную сумму. PAYMENT_FAILURE_RATE задаёт
# долю отклонений от 0 до 1 на основе хеша идентификатора заказа.
# Имитатор только записывает состояния в payments. Для реальной интеграции
# потребовались бы учётные данные провайдера, расчёты и соблюдение PCI.

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Переключается экспорт спанов. Идентификаторы и передача контекста работают постоянно.
      # docker-compose.yml turns it off for the containers unless Jaeger is wanted.
      export:
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:true}
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.orders: ${LOG_LEVEL_APP:INFO}
  pattern:
    # Идентификатор запроса, запустившего Saga, добавляется в MDC через HTTP-фильтр
    # или перехватчик Kafka и выводится в консольном шаблоне Spring Boot.
    correlation: "[${spring.application.name:payment-service},%X{correlationId:-},%X{traceId:-}] "
