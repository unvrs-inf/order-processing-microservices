# Параметры завершённого эксперимента с Kafka.
# Меняет начальную кучу с 256m на 128m. Максимальный размер остаётся 512m.
# Во время эксперимента RSS составлял 470.7 MiB через 85 секунд и 496.5 MiB через
# 386 секунд. До эксперимента он составлял 347.6–381.7 MiB через три часа.
# Из-за разного времени работы эти измерения не подтверждают экономию памяти.
# Если эксперимент повторяется, добавь этот файл после runtime-memory-preservation.yml.
# Чтобы вернуть Xms 256m, пересоздай Kafka без этого файла.
# Xmx ограничивает кучу JVM. RSS включает также память вне кучи.

services:
  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms128m"
